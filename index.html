<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Conta movimenti dita</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --text-dim: #6b6b6b;
    --accent: #2f6fed;
    --accent-open: #1fae5f;
    --accent-closed: #e0592b;
    --border: #e2e4e8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121316;
      --card-bg: #1c1e22;
      --text: #f2f2f2;
      --text-dim: #9a9ea6;
      --accent: #5b8dfa;
      --accent-open: #34d17c;
      --accent-closed: #ff7a4d;
      --border: #2c2f35;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121316;
    --card-bg: #1c1e22;
    --text: #f2f2f2;
    --text-dim: #9a9ea6;
    --accent: #5b8dfa;
    --accent-open: #34d17c;
    --accent-closed: #ff7a4d;
    --border: #2c2f35;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 4px 0 12px;
    text-align: center;
  }
  .video-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 3 / 4;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  video.mirror, canvas.mirror { transform: scaleX(-1); }

  .stats {
    width: 100%;
    max-width: 480px;
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .card {
    flex: 1;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }
  .card .label {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .card .value {
    font-size: 2rem;
    font-weight: 700;
    margin-top: 4px;
  }
  #stateValue.open { color: var(--accent-open); }
  #stateValue.closed { color: var(--accent-closed); }

  .controls {
    width: 100%;
    max-width: 480px;
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  button:active { opacity: 0.8; }

  #status {
    margin-top: 12px;
    font-size: 0.85rem;
    color: var(--text-dim);
    text-align: center;
    min-height: 1.2em;
  }

  .slider-row {
    width: 100%;
    max-width: 480px;
    margin-top: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .slider-row label {
    font-size: 0.8rem;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }
  .slider-row input[type=range] {
    width: 100%;
    margin-top: 6px;
  }
</style>
</head>
<body>

<h1>✋ Conta apertura/chiusura dita</h1>

<div class="video-wrap">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
</div>

<div class="stats">
  <div class="card">
    <div class="label">Conteggio</div>
    <div class="value" id="countValue">0</div>
  </div>
  <div class="card">
    <div class="label">Stato</div>
    <div class="value" id="stateValue">--</div>
  </div>
</div>

<div class="controls">
  <button class="primary" id="startBtn">Avvia fotocamera</button>
  <button id="switchBtn">Cambia fotocamera</button>
  <button id="resetBtn">Azzera</button>
</div>

<div class="slider-row">
  <label>Sensibilità apertura <span id="openLbl">0.28</span></label>
  <input type="range" id="openSlider" min="0.15" max="0.5" step="0.01" value="0.28">
  <label style="margin-top:8px;">Sensibilità chiusura <span id="closeLbl">0.15</span></label>
  <input type="range" id="closeSlider" min="0.05" max="0.3" step="0.01" value="0.15">
</div>

<div id="status">Tocca "Avvia fotocamera" e concedi l'accesso.</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const countEl = document.getElementById('countValue');
const stateEl = document.getElementById('stateValue');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const switchBtn = document.getElementById('switchBtn');
const resetBtn = document.getElementById('resetBtn');
const openSlider = document.getElementById('openSlider');
const closeSlider = document.getElementById('closeSlider');
const openLbl = document.getElementById('openLbl');
const closeLbl = document.getElementById('closeLbl');

let count = 0;
let state = 'CHIUSO';
let camera = null;
let hands = null;
let running = false;
let facingMode = 'user'; // 'user' = anteriore, 'environment' = posteriore

function applyMirror() {
  const shouldMirror = facingMode === 'user';
  video.classList.toggle('mirror', shouldMirror);
  canvas.classList.toggle('mirror', shouldMirror);
}
applyMirror();

openSlider.addEventListener('input', () => openLbl.textContent = openSlider.value);
closeSlider.addEventListener('input', () => closeLbl.textContent = closeSlider.value);

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function onResults(results) {
  canvas.width = video.videoWidth || canvas.clientWidth;
  canvas.height = video.videoHeight || canvas.clientHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const lm = results.multiHandLandmarks[0];

    ctx.fillStyle = 'rgba(91,141,250,0.9)';
    [4, 8, 0, 9].forEach(i => {
      ctx.beginPath();
      ctx.arc(lm[i].x * canvas.width, lm[i].y * canvas.height, 6, 0, 2 * Math.PI);
      ctx.fill();
    });
    ctx.strokeStyle = 'rgba(91,141,250,0.7)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(lm[4].x * canvas.width, lm[4].y * canvas.height);
    ctx.lineTo(lm[8].x * canvas.width, lm[8].y * canvas.height);
    ctx.stroke();

    const pinch = dist(lm[4], lm[8]);
    const scale = dist(lm[0], lm[9]);
    const normDist = scale > 1e-6 ? pinch / scale : 0;

    const openThresh = parseFloat(openSlider.value);
    const closeThresh = parseFloat(closeSlider.value);

    if (state === 'CHIUSO' && normDist > openThresh) {
      state = 'APERTO';
    } else if (state === 'APERTO' && normDist < closeThresh) {
      state = 'CHIUSO';
      count += 1;
      countEl.textContent = count;
    }

    stateEl.textContent = state;
    stateEl.className = state === 'APERTO' ? 'value open' : 'value closed';
    statusEl.textContent = 'dist: ' + normDist.toFixed(2);
  } else {
    statusEl.textContent = 'Nessuna mano rilevata — inquadra la mano nel riquadro.';
  }
}

async function startCamera() {
  applyMirror();

  if (!hands) {
    hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });
    hands.onResults(onResults);
  }

  camera = new Camera(video, {
    onFrame: async () => {
      await hands.send({ image: video });
    },
    width: 480,
    height: 640,
    facingMode: facingMode
  });

  await camera.start();
}

async function start() {
  if (running) return;
  startBtn.disabled = true;
  startBtn.textContent = 'Avvio in corso...';

  try {
    await startCamera();
    running = true;
    startBtn.textContent = 'Fotocamera attiva';
    statusEl.textContent = 'Inquadra la mano con pollice e indice vicini.';
  } catch (err) {
    statusEl.textContent = 'Errore fotocamera: ' + (err && err.message ? err.message : err);
    startBtn.disabled = false;
    startBtn.textContent = 'Avvia fotocamera';
  }
}

async function switchCamera() {
  facingMode = facingMode === 'user' ? 'environment' : 'user';

  if (!running) {
    applyMirror();
    statusEl.textContent = facingMode === 'user'
      ? 'Fotocamera anteriore selezionata.'
      : 'Fotocamera posteriore selezionata.';
    return;
  }

  switchBtn.disabled = true;
  statusEl.textContent = 'Cambio fotocamera...';
  try {
    if (camera) camera.stop();
  } catch (e) { /* ignore */ }

  try {
    await startCamera();
    statusEl.textContent = 'Inquadra la mano con pollice e indice vicini.';
  } catch (err) {
    statusEl.textContent = 'Errore fotocamera: ' + (err && err.message ? err.message : err);
    running = false;
    startBtn.disabled = false;
    startBtn.textContent = 'Avvia fotocamera';
  } finally {
    switchBtn.disabled = false;
  }
}

resetBtn.addEventListener('click', () => {
  count = 0;
  state = 'CHIUSO';
  countEl.textContent = count;
  stateEl.textContent = '--';
  stateEl.className = 'value';
});

startBtn.addEventListener('click', start);
switchBtn.addEventListener('click', switchCamera);
</script>

</body>
</html>
